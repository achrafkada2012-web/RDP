name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 36000

    steps:
      - name: Free Up Disk Space
        shell: pwsh
        run: |
          Get-PSDrive C | Select-Object Used, Free
          $paths = @(
            "C:\Android",
            "C:\Program Files\Android",
            "C:\Program Files (x86)\Android",
            "C:\ProgramData\chocolatey\lib",
            "C:\Julia",
            "C:\Strawberry",
            "C:\Rust",
            "$env:USERPROFILE\.cargo",
            "$env:USERPROFILE\.rustup"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Removing $p"
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          docker system prune -a -f 2>$null
          Get-PSDrive C | Select-Object Used, Free

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          # NLA enabled (safer, since the port is now exposed via a public tunnel)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tunnel" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tunnel" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Install and Start ngrok Tunnel
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          choco install ngrok -y --no-progress
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389" -WindowStyle Hidden

          $publicUrl = $null
          $retries = 0
          while (-not $publicUrl -and $retries -lt 12) {
              Start-Sleep -Seconds 5
              try {
                  $api = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
                  $publicUrl = $api.tunnels[0].public_url -replace '^tcp://', ''
              } catch {}
              $retries++
          }
          if (-not $publicUrl) {
              Write-Error "ngrok tunnel was not established."
              exit 1
          }
          echo "RDP_ADDRESS=$publicUrl" >> $env:GITHUB_ENV

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:RDP_ADDRESS"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
