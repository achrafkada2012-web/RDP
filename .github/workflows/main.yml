name: RDP
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc-virtual:
    runs-on: windows-latest
    timeout-minutes: 36000
    steps:
      - name: Mostrar espaço em disco
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='Usado(GB)';e={[math]::Round($_.Used/1GB,1)}}, @{n='Livre(GB)';e={[math]::Round($_.Free/1GB,1)}}

      - name: Instalar AnyDesk e mostrar ID e senha
        timeout-minutes: 15
        shell: pwsh
        run: |
          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()
          $pw = "Ab3-" + (-join ($chars | Get-Random -Count 10))
          $ad = "C:\AnyDesk\AnyDesk.exe"

          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
          Start-Process "$env:TEMP\AnyDesk.exe" -ArgumentList "--install C:\AnyDesk --start-with-win --silent" -Wait

          for ($i = 0; $i -lt 40 -and -not (Test-Path $ad); $i++) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path $ad)) {
            Write-Error "AnyDesk nao foi instalado"
            exit 1
          }

          Start-Sleep -Seconds 15
          cmd /c "echo $pw | `"$ad`" --set-password"
          Start-Sleep -Seconds 5

          $id = ""
          for ($i = 0; $i -lt 12 -and -not $id; $i++) {
            $id = (& $ad --get-id | Out-String).Trim()
            if (-not $id) { Start-Sleep -Seconds 5 }
          }
          if (-not $id) {
            Write-Error "Nao consegui obter o ID do AnyDesk"
            exit 1
          }

          Write-Host ""
          Write-Host "=============================="
          Write-Host "ID: $id"
          Write-Host "SENHA: $pw"
          Write-Host "=============================="

      - name: Ativar RDP e criar usuario
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                           -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                           -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tunnel" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tunnel" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

          $chars = "abcdefghjkmnpqrstuvwxyz23456789".ToCharArray()
          $rdpPw = "Ab3-" + (-join ($chars | Get-Random -Count 10))
          $securePass = ConvertTo-SecureString $rdpPw -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          echo "RDP_PASSWORD=$rdpPw" >> $env:GITHUB_ENV

      - name: Abrir tunel ngrok para Windows App
        timeout-minutes: 15
        continue-on-error: true
        shell: pwsh
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Error "Secret NGROK_AUTH_TOKEN vazio ou ausente"
            exit 1
          }

          $zip = "$env:TEMP\ngrok.zip"
          $dir = "$env:TEMP\ngrok"
          Invoke-WebRequest -Uri "https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $ngrok = "$dir\ngrok.exe"

          & $ngrok config add-authtoken $env:NGROK_AUTH_TOKEN

          $log = "$env:TEMP\ngrok.log"
          $err = "$env:TEMP\ngrok.err"
          Start-Process -FilePath $ngrok `
            -ArgumentList "tcp","3389","--log=stdout" `
            -RedirectStandardOutput $log -RedirectStandardError $err `
            -WindowStyle Hidden

          $addr = $null
          for ($i = 0; $i -lt 12 -and -not $addr; $i++) {
            Start-Sleep -Seconds 5
            try {
              $api = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              $addr = $api.tunnels[0].public_url -replace '^tcp://', ''
            } catch {}
          }

          if (-not $addr) {
            Write-Host "===== ngrok log ====="
            if (Test-Path $log) { Get-Content $log }
            if (Test-Path $err) { Get-Content $err }
            Write-Error "Tunel ngrok nao foi criado"
            exit 1
          }
          echo "RDP_ADDRESS=$addr" >> $env:GITHUB_ENV

      - name: Mostrar acesso Windows App
        shell: pwsh
        run: |
          Write-Host ""
