name: Automated Windows Server Build

on:
  workflow_dispatch: # Manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Run Complete Windows Installation Script
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"

        # 1) Setup Workspace and Paths
        Write-Host "=== 1/5 Preparing Workspace Directories ===" -ForegroundColor Cyan
        $IsoPath = "C:\ISO\Windows_Server.iso"
        $VMRoot = "D:\VMs"
        $VMName = "WinServer"
        New-Item -ItemType Directory -Path "C:\ISO" -Force | Out-Null
        New-Item -ItemType Directory -Path $VMRoot -Force | Out-Null

        # 2) Download Windows Server ISO from Official Microsoft Link
        Write-Host "=== 2/5 Downloading Windows Server ISO ===" -ForegroundColor Cyan
        $isoUrl = "https://microsoft.com"
        Invoke-WebRequest -Uri $isoUrl -OutFile $IsoPath
        Write-Host "ISO Download completed successfully." -ForegroundColor Green

        # 3) Generate Autounattend.xml for Automated Unattended Setup
        Write-Host "=== 3/5 Generating Answer File (Autounattend.xml) ===" -ForegroundColor Cyan
        $unattendXml = @"
        <?xml version="1.0" encoding="utf-8"?>
        <unattend xmlns="urn:schemas-microsoft-com:unattend">
            <settings xmlns:wcm="http://microsoft.com" xmlns:xsi="http://w3.org" pass="windowsPE">
                <component name="Microsoft-Windows-International-Core-WinPE" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                    <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                    <InputLocale>en-US</InputLocale>
                    <SystemLocale>en-US</SystemLocale>
                    <UILanguage>en-US</UILanguage>
                    <UserLocale>en-US</UserLocale>
                </component>
                <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                    <DiskConfiguration>
                        <Disk wcm:action="add">
                            <CreatePartitions>
                                <CreatePartition wcm:action="add">
                                    <Order>1</Order>
                                    <Type>Primary</Type>
                                    <Extend>true</Extend>
                                </CreatePartition>
                            </CreatePartitions>
                            <ModifyPartitions>
                                <ModifyPartition wcm:action="add">
                                    <Active>true</Active>
                                    <Format>NTFS</Format>
                                    <Label>System</Label>
                                    <Letter>C</Letter>
                                    <Order>1</Order>
                                    <PartitionID>1</PartitionID>
                                </ModifyPartition>
                            </ModifyPartitions>
                            <DiskID>0</DiskID>
                            <WillWipeDisk>true</WillWipeDisk>
                        </Disk>
                    </DiskConfiguration>
                    <ImageInstall>
                        <OSImage>
                            <InstallFrom><MetaData wcm:action="add"><Key>/Image/Index</Key><Value>1</Value></MetaData></InstallFrom>
                            <InstallTo><DiskID>0</DiskID><PartitionID>1</PartitionID></InstallTo>
                        </OSImage>
                    </ImageInstall>
                    <UserData>
                        <AcceptEula>true</AcceptEula>
                    </UserData>
                </component>
            </settings>
            <settings pass="oobeSystem">
                <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
                    <UserAccounts>
                        <AdministratorPassword>
                            <Value>Administrator</Value>
                            <PlainText>true</PlainText>
                        </AdministratorPassword>
                    </UserAccounts>
                    <AutoLogon>
                        <Password><Value>Administrator</Value><PlainText>true</PlainText></Password>
                        <Enabled>true</Enabled>
                        <Username>Administrator</Username>
                    </AutoLogon>
                    <FirstLogonCommands>
                        <SynchronousCommand wcm:action="add">
                            <CommandLine>powershell -Command "Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0; Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'"</CommandLine>
                            <Description>Enable RDP</Description>
                            <Order>1</Order>
                        </SynchronousCommand>
                    </FirstLogonCommands>
                </component>
            </settings>
        </unattend>
        "@
        $unattendPath = "C:\ISO\Autounattend.xml"
        Set-Content -Path $unattendPath -Value $unattendXml

        # 4) Create and Configure Hyper-V Virtual Machine (160GB Disk)
        Write-Host "=== 4/5 Building Virtual Machine ===" -ForegroundColor Cyan
        $vmDir = Join-Path $VMRoot $VMName
        New-Item -ItemType Directory -Path $vmDir -Force | Out-Null
        $vhdPath = Join-Path $vmDir "$VMName.vhd"
        
        # Create Dynamic VHD (160 GB)
        New-VHD -Path $vhdPath -SizeBytes (160 * 1GB) -Dynamic | Out-Null
        
        # Deploy VM on GitHub's Runner Default Network Switch
        New-VM -Name $VMName -Generation 1 -MemoryStartupBytes (6 * 1GB) -VHDPath $vhdPath -Path $VMRoot -SwitchName "Default Switch" | Out-Null
        Set-VM -Name $VMName -ProcessorCount 4 -CheckpointType Disabled
        Set-VMMemory -VMName $VMName -DynamicMemoryEnabled $false
        
        # Attach ISO and Start VM Boot
        Set-VMDvdDrive -VMName $VMName -Path $IsoPath
        Start-VM -Name $VMName
        
        Write-Host "Unattended OS installation started inside the VM..." -ForegroundColor Yellow
        
        # IP Fetching Loop
        Write-Host "Scanning network adapters to retrieve internal VM IP address..." -ForegroundColor Cyan
        $ipFound = $false
        for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 30
            $vmNet = Get-VMNetworkAdapter -VMName $VMName
            $ips = $vmNet.IPAddresses | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' }
            if ($ips) {
                Write-Host "--------------------------------------------------------" -ForegroundColor Green
                Write-Host "SUCCESS: VM successfully captured on the network!" -ForegroundColor Green
                Write-Host "VM INTERNAL IP ADDRESS IS: $($ips -join ', ')" -ForegroundColor Green
                Write-Host "--------------------------------------------------------" -ForegroundColor Green
                $ipFound = $true
                break
            }
            $currentAttempt = $i + 1
            Write-Host "Waiting for VM network synchronization... (Attempt $currentAttempt / 30)" -ForegroundColor Yellow
        }

        if (-not $ipFound) {
            Write-Host "WARNING: Could not fetch IP yet, continuing setup in background..." -ForegroundColor Yellow
        }

        # Final installation phase buffer
        Write-Host "Finalizing Windows installation buffer..." -ForegroundColor Cyan
        Start-Sleep -Seconds 450
        
        # Safely power down VM to extract the clean VHD drive
        Stop-VM -Name $VMName -Force -TurnOff

        # 5) Export Final Artifact VHD Disk File
        Write-Host "=== 5/5 Preparing VHD Drive for Artifact Upload ===" -ForegroundColor Cyan
        Move-Item -Path $vhdPath -Destination ".\WinServer_Ready.vhd"
        Write-Host "VM Build completed successfully!" -ForegroundColor Green

    - name: Upload Finished Windows VHD Disk
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Server-160GB-Disk
        path: .\WinServer_Ready.vhd
        retention-days: 5
